[project]
# `recipes` is taken on PyPI, so the distribution is prefixed. The import
# stays `recipes`.
name = "mealtime-recipes"
version = "0.1.0"
description = "A searchable store of your own recipes, with macro arithmetic and a self-contained share URL."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "owahltinez", email = "oscar@wahltinez.org" }]
keywords = ["recipes", "nutrition", "macros", "cli", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = ["click-agentcli>=0.1.0",
    "mealtime-nutrition>=0.1.0", "mealtime-pantry>=0.1.0",
    "mealtime-plate>=0.1.0", "click>=8.1", "python-dotenv>=1.0",
    "PyYAML>=6.0"]

# Two sibling checkouts rather than releases, and CI checks both out beside
# this one. `mealtime-nutrition` is not on PyPI yet; `mealtime-pantry` is, but
# only at the release that still writes `carbs`, and this package reads
# pantry's records. They have to move together.
#
# RELEASE BLOCKER: `[tool.uv.sources]` is not written into a wheel, so a release
# cut from here would declare both from PyPI and find one missing and one too
# old. Both entries have to become version pins first, and the order is
# nutrition, then pantry, then recipes -- each one reads the names the one
# before it writes, so this package is released last.
[tool.uv.sources]
mealtime-nutrition = { path = "../nutrition", editable = true }
mealtime-pantry = { path = "../pantry", editable = true }

[project.urls]
Homepage = "https://github.com/mealtime-tools/recipes"

[project.scripts]
recipes = "recipes.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipes"]

# The Agent Skill is authored at the repository root, where a human sees it,
# and mapped into the package so `recipes skill install` finds it through
# importlib.resources in a wheel as well as a checkout.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "recipes/skills/recipes/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["src/recipes"]
python_files = ["*_test.py"]

# Keep the repository's formatter and linter on the same line length. The
# editable install puts `recipes` in site-packages, which makes ruff guess it
# is third party and reorder the test imports; saying so once settles it.
[tool.ruff]
line-length = 79

[tool.ruff.lint.isort]
known-first-party = ["recipes"]
