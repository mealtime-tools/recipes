name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: eat/recipes

      # All three are path dependencies until they reach PyPI at a release that
      # speaks the canonical nutrient names, so the runner needs them beside
      # this checkout. actions/checkout cannot write outside the workspace, so
      # the layout is reproduced inside it: the mealtime tools share a parent
      # directory and `click-agentcli` sits one level above it, which is what
      # the relative paths in `[tool.uv.sources]` mean.
      - uses: actions/checkout@v7
        with:
          repository: owahltinez/click-agentcli
          path: agentcli

      - uses: actions/checkout@v7
        with:
          repository: mealtime-tools/nutrition
          path: eat/nutrition

      - uses: actions/checkout@v7
        with:
          repository: mealtime-tools/pantry
          path: eat/pantry

      # Pinned exactly: setup-uv dropped its floating major tags after v7,
      # so v8 and later only exist as exact versions.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run test suite
        run: uv run --python ${{ matrix.python-version }} pytest
        working-directory: eat/recipes
